<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charger Timer</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1b1f23;--mute:#6b7280;--line:#dcd8cf;--on:#0a7d4f;--off:#4b5563;--bad:#b42318;--btn:#1b1f23;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--ink:#eceae4;--mute:#9aa1a9;--line:#2e343a;--on:#3ddc97;--off:#9aa1a9;--bad:#ff8a80;--btn:#eceae4;--btnink:#14171a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:460px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:18px;margin:0 0 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.state{font-size:14px;font-weight:700;color:var(--off)}
.state.on{color:var(--on)}.state.bad{color:var(--bad)}
.big{font:700 56px/1.1 "Courier New",monospace;letter-spacing:-1px;margin:6px 0 2px}
.sub{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.grid b{display:block;font-size:17px}
.grid span{color:var(--mute);font-size:13px}
.alert{background:var(--bad);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
button,input{font:inherit}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 6px;cursor:pointer}
button.sel{border-color:var(--ink);outline:2px solid var(--ink)}
button.main{background:var(--btn);color:var(--btnink);border:0;width:100%;font-weight:700;margin-top:8px}
button.stop{background:none;color:var(--bad);border:1px solid var(--bad);width:100%;margin-top:8px;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--on);outline-offset:2px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:8px}
label{font-size:14px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{position:relative;width:60px;height:34px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:34px;transition:.2s}
.sw span:before{content:"";position:absolute;width:26px;height:26px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--on)}
.sw input:checked+span:before{transform:translateX(26px)}
.sw input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.hide{display:none}
a,.link{color:var(--mute);font-size:13px;cursor:pointer;background:none;border:0;padding:0;text-decoration:underline}
</style>
</head>
<body>
<main>
<h1><span>Charger Timer</span><button class="link hide" id="out">Sign out</button></h1>

<section id="login" class="card hide">
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw" style="display:block;margin-top:10px">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="main" id="in">Sign in</button>
  <p class="sub" id="lerr" style="color:var(--bad)"></p>
</section>

<section id="app" class="hide">
  <div id="alert" class="alert hide"></div>
  <div class="card">
    <div class="state" id="state">Connecting</div>
    <div class="big" id="remain">--:--:--</div>
    <div class="sub" id="remainLbl">time remaining</div>
    <div class="grid">
      <div><b id="elapsed">--</b><span>Charging for</span></div>
      <div><b id="cutAt">--</b><span>Cuts off at</span></div>
      <div><b id="last">--</b><span>Last cut off</span></div>
      <div><b id="wifi">--</b><span>Device Wi-Fi</span></div>
    </div>
  </div>

  <div class="card row">
    <div><b>Power</b><div class="sub">Switch on or off by hand, no timer</div></div>
    <label class="sw"><input type="checkbox" id="pwr" aria-label="Power on or off"><span></span></label>
  </div>

  <div class="card">
    <label>Charge for</label>
    <div class="presets" id="presets">
      <button data-m="30">30 min</button><button data-m="60" class="sel">1 h</button>
      <button data-m="120">2 h</button><button data-m="180">3 h</button>
    </div>
    <label for="cm">Or custom minutes</label>
    <input id="cm" type="number" min="1" max="1440" inputmode="numeric" placeholder="e.g. 90">
    <button class="main" id="start">Start charging</button>
    <button id="add" style="width:100%;margin-top:8px">Add 30 minutes</button>
    <button class="stop" id="stop">Cut off now</button>
    <p class="sub" id="msg"></p>
  </div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,set,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ===== PASTE YOUR FIREBASE CONFIG HERE (Project settings > Your apps > Web) =====
const firebaseConfig = {
  apiKey: "AIzaSyBUSzOgUvLa7LgFUNW32vjwsENWFCiIwo0",
  authDomain: "timer-e034a.firebaseapp.com",
  databaseURL: "https://timer-e034a-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "timer-e034a"
};

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getDatabase(app);
const $ = id => document.getElementById(id);
let s = null, minutes = 60, unsub = null;

const hms = t => { t = Math.max(0, Math.floor(t)); const p = n => String(n).padStart(2,"0");
  return p(Math.floor(t/3600)) + ":" + p(Math.floor(t%3600/60)) + ":" + p(t%60); };
const clock = e => e ? new Date(e*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "--";
const when = e => e ? new Date(e*1000).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "none yet";

onAuthStateChanged(auth, u => {
  $("login").classList.toggle("hide", !!u); $("app").classList.toggle("hide", !u); $("out").classList.toggle("hide", !u);
  if (unsub) unsub();
  if (u) unsub = onValue(ref(db,"status"), snap => { s = snap.val(); render(); });
});
$("in").onclick = () => signInWithEmailAndPassword(auth,$("em").value,$("pw").value).catch(() => $("lerr").textContent = "Wrong email or password.");
$("out").onclick = () => signOut(auth);

document.querySelectorAll("#presets button").forEach(b => b.onclick = () => {
  minutes = +b.dataset.m; $("cm").value = "";
  document.querySelectorAll("#presets button").forEach(x => x.classList.toggle("sel", x === b));
});
$("cm").oninput = () => { if (+$("cm").value > 0) { minutes = +$("cm").value; document.querySelectorAll("#presets button").forEach(x => x.classList.remove("sel")); } };

const send = (action, m) => set(ref(db,"cmd"), {action, minutes: m||0})
  .then(() => $("msg").textContent = "Sent. The device picks it up within a few seconds.")
  .catch(() => $("msg").textContent = "Could not send. Check your connection.");
$("start").onclick = () => send("start", minutes);
$("add").onclick = () => send("add", 30);
$("stop").onclick = () => send("stop");
$("pwr").onchange = () => send($("pwr").checked ? "on" : "off");

function render() {
  const now = Date.now()/1000;
  const online = s && now - (s.heartbeat||0) < 20;
  const on = online && s.on;
  const st = $("state");
  st.className = "state " + (!online ? "bad" : on ? "on" : "");
  const man = on && s.manual;
  st.textContent = !s ? "No data yet" : !online ? "Device offline" : on ? (man ? "Charging (manual)" : "Charging") : "Cut off";
  $("remain").textContent = on ? (man ? "No timer" : hms(s.endEpoch - now)) : "--:--:--";
  if (man) $("remain").style.fontSize = "40px"; else $("remain").style.fontSize = "";
  $("remainLbl").textContent = on ? (man ? "stays on until you turn it off" : "time remaining") : "no timer running";
  $("elapsed").textContent = on ? hms(now - s.startEpoch) : "--";
  $("cutAt").textContent = on ? (man ? "Manual" : clock(s.endEpoch)) : "--";
  $("pwr").checked = !!on; $("pwr").disabled = !online;
  $("last").textContent = s ? when(s.lastCutoff) : "--";
  $("wifi").textContent = !online ? "Offline" : s.wifi ? "Connected" : "Lost";
  const err = !s ? "" : !online ? "Device is not reporting. Check its power and Wi-Fi. A running timer still cuts off on the device." : (s.err || "");
  $("alert").textContent = "Problem: " + err; $("alert").classList.toggle("hide", !err);
}
setInterval(render, 1000);
</script>
</body>
</html>
